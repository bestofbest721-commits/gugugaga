<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card - Anant Bafna</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Card Container -->
    <div class="relative w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden my-6 pb-6">
        
        <!-- Top Purple Header -->
        <div class="h-36 bg-[#432bc9] rounded-b-[40%]"></div>

        <!-- Profile Avatar Section -->
        <div class="relative -mt-20 text-center px-6">
            <!-- Circular Avatar Container -->
            <div class="inline-block relative">
                <div class="w-32 h-32 rounded-full border-4 border-white overflow-hidden shadow-md bg-gray-200 mx-auto">
                    <!-- SVG Avatar Placeholder -->
                    <svg class="w-full h-full text-gray-400 bg-gray-100" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
            </div>

            <!-- Name and Verification Badge -->
            <h1 class="text-2xl font-bold text-gray-900 mt-3">Anant Bafna</h1>
            
            <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-600 text-white text-xs font-semibold rounded-full shadow-sm">
                <!-- Checkmark Icon -->
                <svg class="w-3.5 h-3.5 stroke-current stroke-[3]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                <span>Verified</span>
            </div>

            <!-- Action Button -->
            <div class="mt-4">
                <button onclick="toggleQRCode()" class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 bg-sky-100 hover:bg-sky-200 text-sky-900 font-semibold rounded-2xl transition-colors duration-200 text-sm">
                    <span>Generate vCard / QR</span>
                    <!-- QR Code Icon -->
                    <svg class="w-5 h-5 text-sky-900" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 13h6v6H3v-6zm2 2v2h2v-2H5zm13-2h1v2h-1v-2zm-3 0h2v1h-2v-1zm1 3h2v2h-2v-2zm-3-1h1v1h-1v-1zm1 3h2v2h-2v-2zm2-2h1v1h-1v-1zm1 2h2v1h-2v-1zm-4 1h1v1h-1v-1zm8-9v2h-1V9h1zm-1 3h1v1h-1v-1z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Scannable QR Code Box (Hidden by default, shown on button click or directly visible) -->
        <div id="qr-container" class="mt-4 mx-4 p-4 bg-white border border-gray-200 rounded-2xl shadow-inner flex flex-col items-center justify-center">
            <div id="qrcode"></div>
            <p class="text-xs text-gray-500 mt-2 font-medium">Scan to save contact or open page</p>
        </div>

        <!-- Information Details List -->
        <div class="mt-6 mx-4 bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden divide-y divide-gray-100">
            <!-- DOB -->
            <div class="flex items-center justify-between px-4 py-3.5 text-sm">
                <span class="font-bold text-gray-900 w-24">DOB</span>
                <span class="text-gray-800 font-medium flex-1">06-10-2011</span>
            </div>

            <!-- Gender -->
            <div class="flex items-center justify-between px-4 py-3.5 text-sm">
                <span class="font-bold text-gray-900 w-24">Gender</span>
                <span class="text-gray-800 font-medium flex-1">Male</span>
            </div>

            <!-- Mobile -->
            <div class="flex items-center justify-between px-4 py-3.5 text-sm">
                <span class="font-bold text-gray-900 w-24">Mobile</span>
                <span class="text-gray-800 font-medium flex-1">9073109955</span>
            </div>

            <!-- Email -->
            <div class="flex items-start justify-between px-4 py-3.5 text-sm">
                <span class="font-bold text-gray-900 w-24">Email</span>
                <span class="text-gray-800 font-medium flex-1 break-all">anantbafna7@gmail.com</span>
            </div>
        </div>

    </div>

    <!-- JavaScript to render QR Code -->
    <script>
        // Formatted vCard data so phone cameras scan it directly into contacts
        const contactVCard = `BEGIN:VCARD
VERSION:3.0
FN:Anant Bafna
N:Bafna;Anant;;;
TEL;TYPE=CELL:9073109955
EMAIL;TYPE=INTERNET:anantbafna7@gmail.com
BDAY:2011-10-06
END:VCARD`;

        // Generate working scannable QR Code dynamically
        const qrcode = new QRCode(document.getElementById("qrcode"), {
            text: contactVCard,
            width: 160,
            height: 160,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        function toggleQRCode() {
            const container = document.getElementById('qr-container');
            container.classList.toggle('hidden');
        }
    </script>
</body>
</html>
